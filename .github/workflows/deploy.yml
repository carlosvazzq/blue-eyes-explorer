name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /blue-eyes-explorer/
      # Las rutas de Angular (/blue-eyes, /card/123) no existen como archivos;
      # copiar index.html a 404.html hace que funcionen al recargar la página.
      - run: cp dist/blue-eyes-explorer/browser/index.html dist/blue-eyes-explorer/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/blue-eyes-explorer/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4